<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Score Card</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .main-card {
            background: rgba(22, 27, 34, 0.9);
            border: 1px solid rgba(48, 54, 61, 0.8);
            border-radius: 20px;
            padding: 50px 40px;
            width: 100%;
            max-width: 480px;
            text-align: center;
        }
        h1 { font-size: 28px; font-weight: 700; color: #e6edf3; margin-bottom: 6px; }
        .subtitle { color: #8b949e; font-size: 14px; margin-bottom: 30px; }
        .search-input {
            background: rgba(13, 17, 23, 0.8);
            border: 1px solid rgba(48, 54, 61, 0.8);
            border-radius: 10px;
            color: #e6edf3;
            padding: 14px 16px;
            font-size: 14px;
            width: 100%;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-input:focus { border-color: #238636; }
        .search-input::placeholder { color: #484f58; }
        .search-btn {
            background: linear-gradient(135deg, #238636, #2ea043);
            border: none;
            border-radius: 10px;
            color: white;
            padding: 14px;
            font-size: 14px;
            font-weight: 600;
            width: 100%;
            margin-top: 10px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .search-btn:hover { opacity: 0.9; }
        .features {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 24px;
            flex-wrap: wrap;
        }
        .feature-item { color: #8b949e; font-size: 12px; }
        .feature-item i { color: #238636; margin-right: 4px; }
        .lb-link {
            display: inline-block;
            margin-top: 20px;
            color: #58a6ff;
            font-size: 13px;
            text-decoration: none;
        }
        .lb-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="main-card">
    <i class="fab fa-github" style="font-size: 55px; color: #e6edf3; margin-bottom: 12px; display: block;"></i>
    <h1>GitHub Score Card</h1>
    <p class="subtitle">Analyze any GitHub profile and get a developer score</p>

    <form action="/score/" method="get">
        <input type="text" name="username" class="search-input"
               placeholder="Enter GitHub username..." required autocomplete="off">
        <button type="submit" class="search-btn">
            <i class="fas fa-chart-bar me-2"></i>Generate Score Card
        </button>
    </form>

    <div class="features">
        <div class="feature-item"><i class="fas fa-check-circle"></i>Score & Rank</div>
        <div class="feature-item"><i class="fas fa-check-circle"></i>Activity Tracker</div>
        <div class="feature-item"><i class="fas fa-check-circle"></i>PDF Download</div>
        <div class="feature-item"><i class="fas fa-check-circle"></i>Profile Analysis</div>
    </div>

    <a href="/leaderboard/" class="lb-link">
        <i class="fas fa-trophy me-1"></i>View Developer Leaderboard
    </a>
</div>
</body>
</html>
